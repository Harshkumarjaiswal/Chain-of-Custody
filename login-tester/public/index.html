<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OTP Login Tester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 { margin-bottom: 1.5rem; text-align: center; color: #333; }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #555; }
    input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #4f46e5; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 0.75rem;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    #status {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.6rem;
      border-radius: 6px;
      display: none;
    }
    #status.success { background: #d1fae5; color: #065f46; display: block; }
    #status.error   { background: #fee2e2; color: #991b1b; display: block; }
    #status.info    { background: #e0e7ff; color: #3730a3; display: block; }
    #otp-section { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>OTP Verification</h2>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="Enter your email" />
    <button id="sendBtn" onclick="sendOTP()">Send OTP</button>

    <div id="otp-section">
      <label for="otp">Enter OTP</label>
      <input type="text" id="otp" placeholder="Enter 5-digit OTP" maxlength="5" />
      <button onclick="verifyOTP()">Verify OTP</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    async function sendOTP() {
      const email = document.getElementById('email').value.trim();
      const status = document.getElementById('status');

      if (!email) {
        showStatus('Please enter an email address', 'error');
        return;
      }

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch('/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        showStatus(data.message, 'info');
        document.getElementById('otp-section').style.display = 'block';
      } catch (err) {
        showStatus('Failed to send OTP', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send OTP';
      }
    }

    async function verifyOTP() {
      const email = document.getElementById('email').value.trim();
      const otp = document.getElementById('otp').value.trim();

      if (!otp) {
        showStatus('Please enter the OTP', 'error');
        return;
      }

      try {
        const res = await fetch('/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp })
        });
        const data = await res.json();
        showStatus(data.message, data.valid ? 'success' : 'error');
      } catch (err) {
        showStatus('Verification failed', 'error');
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }
  </script>
</body>
</html>
